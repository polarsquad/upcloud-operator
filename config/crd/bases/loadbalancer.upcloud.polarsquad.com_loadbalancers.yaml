                      type: object
                    type:
                      enum:
                      - public
                      - private
                      type: string
                    uuid:
                      description: |-
                        UUID of an existing UpCloud SDN network. Required for private
                        attachments when networkRef is not set.
                      type: string
                  required:
                  - name
                  - type
                  type: object
                maxItems: 8
                minItems: 1
                type: array
