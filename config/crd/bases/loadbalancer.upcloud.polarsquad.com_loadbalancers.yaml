  names:
    kind: LoadBalancer
    listKind: LoadBalancerList
    plural: loadbalancers
    singular: loadbalancer
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.zone
      name: Zone
      type: string
    - jsonPath: .status.operationalState
      name: State
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LoadBalancer is an UpCloud Load Balancer service.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LoadBalancerSpec defines the desired state of an UpCloud
              Load Balancer.
            properties:
              configuredStatus:
                default: started
                description: |-
                  configuredStatus requests the load balancer to be started (default) or
                  stopped. Changes trigger start/shutdown.
                enum:
                - started
                - stopped
                type: string
              deletionPolicy:
                default: Delete
                description: DeletionPolicy decides what happens to the UpCloud resource
                  when the CR is deleted.
                enum:
                - Delete
                - Orphan
                type: string
              labels:
                additionalProperties:
                  type: string
                description: |-
                  UpCloudLabels is the user-controlled part of the labels set on an UpCloud resource.
                  The operator also sets services.k8s.upcloud/managed-by, /namespace and /uid; a
                  value given here overrides the first two but never services.k8s.upcloud/uid.
                type: object
              maintenance:
                description: Maintenance window.
                properties:
                  dow:
                    enum:
                    - monday
                    - tuesday
                    - wednesday
                    - thursday
                    - friday
                    - saturday
                    - sunday
                    type: string
                  time:
                    description: Maintenance time in HH:mm format.
                    maxLength: 5
                    type: string
                type: object
              name:
                description: Name in UpCloud. Defaults to metadata.name.
                maxLength: 64
                pattern: ^[a-zA-Z0-9_-]+$
                type: string
              networks:
                description: Network attachments, 1 to 8. Immutable as a whole.
                items:
                  description: |-
                    LoadBalancerNetworkAttachment is a network attachment for a load balancer.
                    Only public and private types, and IPv4, are valid.
                  properties:
                    family:
                      default: IPv4
                      enum:
                      - IPv4
                      type: string
                    name:
                      maxLength: 64
                      pattern: ^[a-zA-Z0-9_-]+$
                      type: string
                    networkRef:
                      description: |-
                        NetworkRef points at a Network CR in the same namespace; its
