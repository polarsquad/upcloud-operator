                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              routerUUID:
                description: |-
                  RouterUUID is an explicit UpCloud router UUID. Exactly one of routerRef
                  and routerUUID must be set. Immutable.
                type: string
                x-kubernetes-validations:
                - message: routerUUID is immutable
