                - message: addresses are immutable; recreate the Gateway
                  rule: self == oldSelf
              configuredStatus:
                default: started
                description: ConfiguredStatus is "started" or "stopped".
                enum:
                - started
                - stopped
                type: string
              deletionPolicy:
                default: Delete
                description: DeletionPolicy decides what happens to the UpCloud resource
                  when the CR is deleted.
                enum:
                - Delete
                - Orphan
                type: string
              features:
                description: Features the gateway must provide. At least one. Immutable.
                items:
                  type: string
                minItems: 1
                type: array
                x-kubernetes-validations:
                - message: features are immutable; recreate the Gateway
                  rule: self == oldSelf
              labels:
                additionalProperties:
                  type: string
