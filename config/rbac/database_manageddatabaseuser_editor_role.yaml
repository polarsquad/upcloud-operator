# This rule is not used by the project UCK itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the database.upcloud.polarsquad.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: uck
    app.kubernetes.io/managed-by: kustomize
  name: database-manageddatabaseuser-editor-role
rules:
- apiGroups:
  - database.upcloud.polarsquad.com
  resources:
  - manageddatabaseusers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - database.upcloud.polarsquad.com
  resources:
  - manageddatabaseusers/status
  verbs:
  - get
