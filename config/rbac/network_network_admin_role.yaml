# This rule is not used by the project upcloud-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over network.upcloud.polarsquad.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: upcloud-operator
    app.kubernetes.io/managed-by: kustomize
  name: network-network-admin-role
rules:
- apiGroups:
  - network.upcloud.polarsquad.com
  resources:
  - networks
  verbs:
  - '*'
- apiGroups:
  - network.upcloud.polarsquad.com
  resources:
  - networks/status
  verbs:
  - get
