name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/polarsquad/uck

jobs:
  build:
    name: Build ${{ matrix.arch }} (native)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to the GitHub Container Registry
        if: github.ref_type == 'tag'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.ref_type == 'tag' }}
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ github.ref_type == 'tag' && format('{0}-linux-{1}', github.ref_name, matrix.arch) || format('{0}-linux-{1}', github.sha, matrix.arch) }}

  merge:
    name: Merge manifest list
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Create and verify manifest list
        id: publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" \
            "$IMAGE:$TAG-linux-amd64" \
            "$IMAGE:$TAG-linux-arm64"
          platforms=$(docker buildx imagetools inspect "$IMAGE:$TAG" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
          for want in linux/amd64 linux/arm64; do
            [[ " $platforms " == *" $want "* ]] || {
              echo "::error::missing $want (got: $platforms)"
              exit 1
            }
          done
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" \
            --format '{{.Manifest.Digest}}')
          [ -n "$digest" ] || { echo "::error::empty index digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  release:
    name: Sign and publish
    needs: merge
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the consolidated installer
        run: make build-installer IMG=${{ env.IMAGE }}:${{ github.ref_name }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless via GitHub OIDC)
        env:
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/install.yaml --clobber
          else
            args=(--generate-notes)
            case "${{ github.ref_name }}" in
              *rc*|*alpha*|*beta*) args+=(--prerelease) ;;
            esac
            gh release create "${{ github.ref_name }}" "${args[@]}" dist/install.yaml
          fi
