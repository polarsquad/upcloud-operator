name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    env:
      UPCLOUD_TOKEN: ucat_dummy_token_for_e2e
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Setup mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: v2026.10.15 # mise
          install: false
          cache: false

      - name: Install kind
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install kind

      - name: Verify kind installation
        run: |
          want="v$(mise current kind)"
          kind version
          kind version | grep -qF "kind ${want} " || {
            echo "ERROR: kind on PATH is not the mise.toml pin ${want}"
            exit 1
          }

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e
