name: e2e (real UpCloud API)

# COST: one run provisions a real Managed Database (cheapest pg plan) for
# roughly 20 minutes, plus a network, router and managed object storage.
# This workflow is manual-only and gated behind the "upcloud-e2e"
# environment (required reviewers), so the token cannot be spent by an
# unreviewed dispatch. It never runs on PRs or pushes.
#
# Setup (admin, one-time): create a GitHub environment named
# "upcloud-e2e" with required reviewers, and add the repository secret
# UPCLOUD_TOKEN (a scoped UpCloud API token). See docs/development.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-upcloud:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    environment: upcloud-e2e
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Run the real-API e2e suite
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
        run: |
          go mod tidy
          # -timeout overrides Go's 10m default so the alarm can never fire
          # inside AfterSuite, where it would kill the mid-teardown deletes
          # and leak the run's paid resources into the next dispatch. The
          # suite's worst case is ~90m wall clock (BeforeSuite ~2.5m +
          # controller-ready 3m + 6 x 5m Ready waits + 15m MOS Ready +
          # 15m database Ready + 20m waitForCRsGone + 5m waitForGone,
          # plus AfterSuite's own 20m/5m waits on a failed run); 100m
          # covers it with headroom. The MOS wait is 15m because
          # setup-checkup alone has exceeded the old 5m budget (run
          # 35211338876).
          # -ginkgo.timeout raises Ginkgo's own suite alarm, which defaults
          # to 1h and would otherwise fire before -timeout ever could (run
          # 35182758449 died exactly that way, [TIMEDOUT] at 3600s inside
          # deleteAllSamples). It must sit above the ~90m worst-case
          # envelope above and below the 100m Go alarm.
          go test -tags=e2e_upcloud ./test/e2e-upcloud/ -timeout 100m \
            -ginkgo.timeout 95m -v -ginkgo.v

      # Runs even when the suite was killed mid-teardown, so a timeout or a
      # cancelled run cannot leak paid resources.
      - name: Sweep leftover UpCloud resources
        if: always()
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
        run: go run ./test/e2e-upcloud/cleanup

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-${{ github.run_id }}
          path: /tmp/e2e-diagnostics-*/
          if-no-files-found: ignore
          retention-days: 14
