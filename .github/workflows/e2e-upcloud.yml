name: e2e (real UpCloud API)

# COST: one run provisions a real Managed Database (cheapest pg plan) for
# roughly 20 minutes, plus a network, router and managed object storage.
# This workflow is manual-only and gated behind the "upcloud-e2e"
# environment (required reviewers), so the token cannot be spent by an
# unreviewed dispatch. It never runs on PRs or pushes.
#
# Setup (admin, one-time): create a GitHub environment named
# "upcloud-e2e" with required reviewers, and add the repository secret
# UPCLOUD_TOKEN (a scoped UpCloud API token). See docs/development.md.

on:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: runs share one UpCloud account, and cancelling a run
# mid-teardown would leak its paid resources.
concurrency:
  group: e2e-upcloud
  cancel-in-progress: false

jobs:
  e2e-upcloud:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    environment: upcloud-e2e
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Setup mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          version: v2026.10.15 # mise
          install: false
          cache: false

      - name: Install kind
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install kind

      - name: Verify kind installation
        run: |
          want="v$(mise current kind)"
          kind version
          kind version | grep -qF "kind ${want} " || {
            echo "ERROR: kind on PATH is not the mise.toml pin ${want}"
            exit 1
          }

      - name: Run the real-API e2e suite
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
        run: |
          go mod tidy
          # Alarm sizing and incident history: docs/development.md
          # (Real-API e2e timeouts). Keep -timeout > -ginkgo.timeout >
          # the suite worst case, or a mid-teardown kill leaks paid
          # resources into the next dispatch.
          go test -tags=e2e_upcloud ./test/e2e-upcloud/ -timeout 125m \
            -ginkgo.timeout 120m -v -ginkgo.v

      # Runs even when the suite was killed mid-teardown by a timeout alarm,
      # so a failed or timed-out run cannot leak paid resources. A manually
      # cancelled run skips this step and still needs a manual sweep. Fails
      # only when nothing is moving by the deadline: deletes still running
      # on the UpCloud side at the deadline are reported, not failed (the
      # next dispatch re-sweeps).
      - name: Sweep leftover UpCloud resources
        if: always()
        env:
          UPCLOUD_TOKEN: ${{ secrets.UPCLOUD_TOKEN }}
        run: go run ./test/e2e-upcloud/cleanup

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-${{ github.run_id }}
          path: /tmp/e2e-diagnostics-*/
          if-no-files-found: ignore
          retention-days: 14
